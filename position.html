<!DOCTYPE html>
<html>
<head>
    <title>Position</title>

    <style>
        .container {
            width: 100%;
        }

       .box {
    width: 900px;
    height: 585px;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #box1 {
            background-color: antiquewhite;
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3tSgoVeo8Tmbfdt3Vz4fJepydZ_tNfwO4RR-Y5z7_nQ&s=10');
        }

        #box2 {
            background-color: rgb(221, 131, 13);
            position:static;
            top: 0;

            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNe85A4lEnXyMeH4GT2CPIVfOZlqyicaaUYbaDXfxBmg&s=10');
        }

        #box3 {
            background-color: rgb(16, 50, 222);
            position: sticky;
            top: 0;

            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZqLhyh6BIyMTh1snFyLFb6s3rJa3xvR_gWnCvz3yJMg&s=10');
        }

        #box4 {
            background-color: rgb(47, 164, 11);
            position: sticky;
            top: 0;

            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhFMe5ZB2OX5kKk1qIH8RHH6Az2C9iLEaxeXfcdMsnjg&s=10');
        }

        #box5 {
            background-color: rgb(241, 234, 236);
            position: sticky;
            top: 0;

            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_wEgkSqHLFbCKeeA4w6Tdfz6i6zgChNYaPGCE8len4A&s=10');
        }
    </style>
</head>

<body>

   

        <div class="box" id="box1"></div>

        <div class="box" id="box2"></div>

        <div class="box" id="box3"></div>

        <div class="box" id="box4"></div>

        <div class="box" id="box5"></div>

    

</body>
</html>
