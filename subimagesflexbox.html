<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Image Layout</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#dcdcdc;
            font-family:Arial;
        }

        h1{
            text-align:center;
            margin:20px;
        }

        .container{
            width:900px;
            margin:auto;

            display:flex;
            flex-wrap:wrap;
            gap:15px;
        }

        .card{
            border-radius:15px;
            overflow:hidden;
        }

        img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        /* Different Sizes */

        .card1{
            width:430px;
            height:230px;
        }

        .card2{
            width:180px;
            height:230px;
        }

        .card3{
            width:250px;
            height:110px;
        }

        .card4{
            width:250px;
            height:180px;
        }

        .card5{
            width:165px;
            height:180px;
        }

        .card6{
            width:250px;
            height:180px;
        }

        .card7{
            width:430px;
            height:180px;
        }

    </style>
</head>

<body>

<h1>Flexbox Image Gallery</h1>

<div class="container">

    <div class="card card1">
        <img src="images.jpeg">
    </div>

    <div class="card card2">
        <img src="shopping.jpeg">
    </div>

    <div class="card card3">
        <img src="download.webp">
    </div>

    <div class="card card4">
        <img src="images (1).jpeg">
    </div>

    <div class="card card5">
        <img src="download (1).webp">
    </div>

    <div class="card card6">
        <img src="shopping.webp">
    </div>

    <div class="card card7">
        <img src="images.jpeg">
    </div>

</div>

</body>
</html>
