<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
        }

        .container{
            display:flex;
        }

        /* Sidebar */

        .sidebar{
            width:200px;
            height:100vh;
            background-color:#2c3e50;
            color:white;
            padding:20px;
        }

        .sidebar h2{
            margin-bottom:20px;
        }

        .sidebar ul{
            list-style:none;
        }

        .sidebar li{
            margin:20px 0;
        }

        .sidebar a{
            text-decoration:none;
            color:white;
        }

        /* Main Content */

        .main{
            flex:1;
            padding:20px;
        }

        .cards{
            display:flex;
            justify-content:space-between;
            margin-top:20px;
        }

        .card{
            width:30%;
            height:120px;
            border:2px solid gray;
            border-radius:10px;
            padding:20px;
            background-color:white;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:30px;
        }

        table, th, td{
            border:1px solid black;
        }

        th, td{
            padding:10px;
            text-align:center;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>Menu</h2>

        <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Users</a></li>
            <li><a href="#">Products</a></li>
        </ul>

    </div>

    <!-- Main -->

    <div class="main">

        <h1>Dashboard Overview</h1>

        <div class="cards">

            <div class="card">
                <h2>Data</h2>
                <p>120 Users</p>
            </div>

            <div class="card">
                <h2>Data</h2>
                <p>75 Products</p>
            </div>

            <div class="card">
                <h2>Data</h2>
                <p>50 Orders</p>
            </div>

        </div>

        <table>

            <tr>
                <th>Col 1</th>
                <th>Col 2</th>
                <th>Col 3</th>
            </tr>

            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>

            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>

        </table>

    </div>

</div>

</body>
</html>
