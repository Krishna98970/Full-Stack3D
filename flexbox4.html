<html>
    <head>
        <title>
            My Webpage
        </title>
        <style>
            #container{
                display:flex;
                outline:1px solid black;
                flex-direction:row;
                text-align:center;
                height:200px;
                align-items:center;
                justify-content:center;  
                flex-wrap:wrap;  

            }
            #container>div{
                outline:1px dashed red;
                flex-basis:100px;
                height:100px;
            
            }
            #container>div:nth-child(odd){
                background-color:beige;
            }
            #box1,#box2,#box3,#box4,#box5{
                align-items:center;
                justify-items:center;
            }
            #box1{
                flex:3 0 250px;
            }
            #box2,#box3,#box4,#box5{
                 flex:0 1 250px;
               
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div id="box1"><p>1</p></div>
            <div id="box2"><p>2</p></div>
            <div id="box3"><p>3</p></div>
            <div id="box4"><p>4</p></div>
            <div id="box5"><p>5</p></div>
        </div>
    </body>
</html>
