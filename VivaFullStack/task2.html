<html>
<head>

    </title>

<body>
    <div class="bg-blue-200 w-[900px] h-[600px]"> 
        <div>
        <h2 class="text-lg text-red-600"><b>      Task 2 E-Commerce Product Listing</b>        </h2>

        </div>
        <div class="bg-blue-50 w-[500px] h-[500px] mt-5">

            type="text"
            placeholder="Search"

<div class=" bg-yellow-100 w-[150px] h-[400px] mt-3">

    <div class="mt-2">
        <label class="block">
            <input type="checkbox"> Laptops

        <label class="block">
            <input type="checkbox"> Desktops
        </label>

        </label>

            <input type="checkbox"> Accessories
        </label>
    </div>
     <h3 class="font-semibold mt-6">Price Range</h3>

        </label>

</div>
