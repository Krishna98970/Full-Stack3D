<html>
    <head>
        <title>
            My Webpage
        </title>
        <style>
            #container{
                display:flex;
                outline:1px solid black;
                flex-direction:row;
                text-align:center;
                align-content:center;
                justify-content:center;    

            }
            #container>div{
                outline:1px dashed red;
                flex-basis:60px;
                height:60px;
            
            }
            #container>div:nth-child(odd){
                background-color:beige;
            }
            #box1,#box2,#box3,#box4,#box5{
                align-items:center;
                justify-items:center;
            }
            #box1{
                flex-grow:1;
            }
            #box2{
                flex-shrink:2;
            }
            #box2,#box3,#box4,#box5{
                flex-grow:0;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div id="box1"><p>1</p></div>
            <div id="box2"><p>2</p></div>
            <div id="box3"><p>3</p></div>
            <div id="box4"><p>4</p></div>
            <div id="box5"><p>5</p></div>
        </div>
    </body>
</html>
