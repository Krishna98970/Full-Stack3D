<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
    <style>
        .box1{
           background-color:red;
            width:100px;
            height:100px;
            border:2px solid black;
            flex-grow:3;


        }
        .box2{
            background-color:blue;
            width:100px;
            height:100px;
            border:2px solid black;
            flex-grow:2;
        }
        .box3{
            background-color:green;
            width:100px;
            height:100px;

            height:100px;

            flex-grow:1;


        }

            width:100px;
            height:100px;
            border:2px solid black;
            flex-grow:1;
        }
        .container{
            display:flex;
            flex-direction: row;
            flex-basis:100px;
            height:100px;
        
           

        }
    </style>

    <div class="container">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
